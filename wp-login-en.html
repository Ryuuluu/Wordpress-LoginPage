<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Log In ‹ website.com — WordPress</title>
    <meta name="robots" content="max-image-preview:large, noindex, noarchive">
    <link rel="stylesheet" id="dashicons-css" href="/wp-includes/css/dashicons.min.css" media="all">
    <link rel="stylesheet" id="buttons-css" href="/wp-includes/css/buttons.min.css" media="all">
    <link rel="stylesheet" id="forms-css" href="/wp-admin/css/forms.min.css" media="all">
    <link rel="stylesheet" id="l10n-css" href="/wp-admin/css/l10n.min.css" media="all">
    <link rel="stylesheet" id="login-css" href="/wp-admin/css/login.min.css" media="all">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="#" sizes="32x32">
    <link rel="icon" href="#" sizes="192x192">
    <link rel="apple-touch-icon" href="#">
    <meta name="msapplication-TileImage" content="#">
    <style>
        .login h1 a {
            background-image: url('https://s.w.org/style/images/about/WordPress-logotype-wmark.png') !important;
            background-size: 84px 84px !important;
            background-position: center top !important;
            background-repeat: no-repeat !important;
            height: 84px !important;
            width: 84px !important;
            margin: 0 auto 25px !important;
            display: block !important;
        }
    </style>
</head>

<body class="login js login-action-login wp-core-ui  locale-id-id">
    <script>
        document.body.className = document.body.className.replace('no-js', 'js');
    </script>

    <div id="login">
        <h1><a href="https://wordpress.org/">Powered by WordPress</a></h1>
        <form name="loginform" id="loginform" action="#" method="post">
            <p>
                <label for="user_login">Username or Email Address</label>
                <input type="text" name="log" id="user_login" class="input" value="" size="20" autocapitalize="off"
                    autocomplete="username" required="required">
            </p>
            <div class="user-pass-wrap">
                <label for="user_pass">Password</label>
                <div class="wp-pwd">
                    <input type="password" name="pwd" id="user_pass" class="input password-input" value="" size="20"
                        autocomplete="current-password" spellcheck="false" required="required">
                    <button type="button" class="button button-secondary wp-hide-pw hide-if-no-js" data-toggle="0"
                        aria-label="Tampilkan sandi">
                        <span class="dashicons dashicons-visibility" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <p class="forgetmenot"><input name="rememberme" type="checkbox" id="rememberme" value="forever"> <label
                    for="rememberme">Remember Me</label></p>
            <p class="submit">
                <input type="submit" name="wp-submit" id="wp-submit" class="button button-primary button-large"
                    value="Log In">
            </p>
        </form>
        <p id="nav">
            <a class="wp-login-lost-password" href="#">Lost your password?</a>
        </p>
        <p id="backtoblog">
            <a href="#">← Go to website.com</a>
        </p>
    </div>
    <div class="language-switcher">
        <form id="language-switcher" method="get">
            <label for="language-switcher-locales">
                <span class="dashicons dashicons-translation" aria-hidden="true"></span>
                <span class="screen-reader-text">
                    Bahasa </span>
            </label>
            <select name="wp_lang" id="language-switcher-locales">
                <option value="en_US" lang="en" selected="selected" data-installed="1">English (United States)</option>
                <option value="id_ID" lang="id" data-installed="1">Bahasa Indonesia</option>
            </select>
            <input type="submit" class="button" value="Change">
        </form>
    </div>
</body>

</html>
